name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install ProtocolLib dev-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: tinkers-test/install-protocollib-dev.sh
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
